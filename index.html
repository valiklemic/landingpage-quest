<style>
:root{
  color-scheme: dark;
  --bg:#0c0a1f; --bg2:#13102e; --panel:#15122f; --line:#2b2759;
  --text:#ece9ff; --muted:#9b97c9; --stone:#1c1940; --stone-line:#3d3872;
  --accent:#5ef0ff; --pink:#ff5fa2; --violet:#9b7bff; --warn:#ffc56b; --bad:#ff7a9a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h1{font-size:16px;margin:0;letter-spacing:.04em;white-space:nowrap}
#top{background:linear-gradient(90deg,#16103a,#13102e 60%,#101a3a);box-shadow:0 1px 0 #ff5fa233, 0 4px 24px #5ef0ff12}
#top h1 span{background:linear-gradient(90deg,var(--pink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#prog{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
#bar{flex:1;height:10px;background:var(--stone);border-radius:99px;overflow:hidden;border:1px solid var(--stone-line)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5fa2,var(--accent));transition:width .6s}
#progTxt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.btn{background:var(--stone);border:1px solid var(--stone-line);padding:6px 11px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(90deg,#5ef0ff,#9b7bff);color:#07102a;border-color:transparent;font-weight:700;box-shadow:0 0 14px #5ef0ff44}
.btn.primary:disabled{background:var(--stone);color:var(--muted);border-color:var(--stone-line);cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:12px}
#save{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--stone-line);background:var(--stone);color:var(--muted)}
#save.ok{color:var(--accent);border-color:#2f7a96}
#save.warn{color:var(--warn);border-color:#7a5a1d}
#save.bad{color:var(--bad);border-color:#7a2b2b}
#btnPanel{display:none}
#btnInstall{display:none}
#offline{display:none;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid #7a5a1d;color:var(--warn);background:var(--stone)}
body.is-offline #offline{display:inline-block}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#top{padding-top:max(10px,env(safe-area-inset-top))}
html{overscroll-behavior:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapWrap{flex:1;position:relative;min-width:0;background:
  radial-gradient(circle at 50% 50%, #ff5fa224 0, transparent 38%),
  radial-gradient(circle at 50% 50%, #2a1a6a 0, transparent 78%),
  linear-gradient(#5ef0ff0d 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,#5ef0ff0d 1px,transparent 1px) 0 0/44px 44px,
  var(--bg)}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
svg#map{position:absolute;left:0;top:0;width:2000px;height:2000px;display:block;transform-origin:0 0;pointer-events:auto}
#viewport.drag{cursor:grabbing}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoom .btn{width:36px;height:36px;padding:0;font-size:18px}
#legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--muted);background:#0c0a1fcc;padding:6px 10px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap}
#legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#panel{width:400px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;flex:none}
#panel h2{margin:0 0 4px;font-size:18px;line-height:1.25}
#panel h3{margin:18px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--stone-line);margin-right:6px;color:var(--muted)}
.chip.open{color:var(--accent);border-color:#2f7a96}
.chip.done{color:#07102a;background:var(--accent);border-color:var(--accent);font-weight:700}
.chip.locked{color:var(--warn);border-color:#7a5a1d}
.info{margin:6px 0 0;padding-left:18px;color:#cfcaf5}
.info li{margin:3px 0}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field label em{color:var(--warn);font-style:normal}
#gate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a1a6a 0,var(--bg) 70%)}
#gate.show{display:flex}
#gate form{width:min(400px,92vw);background:var(--panel);border:1px solid var(--stone-line);border-radius:18px;padding:26px;box-shadow:0 0 50px #5ef0ff22,0 0 90px #ff5fa222}
#gate h2{margin:0;font-size:20px;letter-spacing:.04em}
#gate h2 span{background:linear-gradient(90deg,var(--pink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.gerr{color:var(--bad);min-height:20px;margin:6px 0 10px;font-size:13px}
.byline{font-size:12px;margin-top:6px}
.banner.onl{background:#0f1f3a;border-color:#2f7a96;color:#bfeaf5}
.field input[type=password],.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;background:#0e0b26;border:1px solid var(--stone-line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
.field textarea{min-height:76px;resize:vertical}
.multi{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--stone-line);border-radius:10px;background:#0e0b26;cursor:pointer;color:var(--text);font-size:13px;transition:all .15s}
.opt:hover{border-color:var(--accent)}
.opt input{accent-color:#ff5fa2;width:16px;height:16px;flex:none}
.opt.on{border-color:var(--pink);background:#2a1246;box-shadow:0 0 10px #ff5fa233}
.hintm{font-size:11px;color:var(--muted);margin-top:4px}
.addopt{display:flex;gap:6px;margin-top:8px}
.addopt input{flex:1;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #2f7a96;border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:13px;cursor:pointer}
.chk input{margin-top:3px;accent-color:#ff5fa2}
.calc{background:#0f1535;border:1px dashed #2f7a96;border-radius:8px;padding:8px 10px;color:var(--accent);margin:10px 0}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.need{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer;background:var(--bg2)}
.need:hover{border-color:var(--accent)}
.need .dot{width:10px;height:10px;border-radius:50%;background:var(--stone-line);flex:none}
.need.done .dot{background:var(--accent)}
.brrow{display:flex;align-items:center;gap:8px;margin:7px 0;cursor:pointer}
.brrow .nm{width:150px;font-size:13px}
.brrow .b{flex:1;height:8px;background:var(--stone);border-radius:99px;overflow:hidden}
.brrow .b i{display:block;height:100%}
.brrow .ct{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.banner{background:#241d0c;border:1px solid #7a5a1d;border-radius:10px;padding:10px 12px;margin:0 0 14px;color:#f1d9a5}
.banner button{margin-top:8px}
.x{float:right}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:#151845;border:1px solid #2f7a96;color:var(--text);padding:10px 16px;border-radius:12px;opacity:0;transition:all .35s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#win{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}
#win.show{display:flex}
#win div{background:var(--panel);border:2px solid var(--accent);border-radius:18px;padding:28px 34px;text-align:center;max-width:420px}
#win h2{margin:0 0 8px;font-size:26px}

/* Karte */
.edge{fill:none;stroke:#38326f;stroke-width:3;stroke-linecap:round}
.edge.cross{stroke-dasharray:3 9;stroke-width:2}
.edge.lit{stroke:var(--c);opacity:.9}
.edge.live{stroke:var(--c);opacity:.9;stroke-dasharray:6 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.node{cursor:pointer}
.node .body{fill:var(--stone);stroke:var(--stone-line);stroke-width:2.5}
.node.open .body{fill:color-mix(in srgb,var(--c) 18%,#0c0a1f);stroke:var(--c);stroke-width:3.5}
.node.done .body{fill:var(--c);stroke:#fff5;stroke-width:2}
.node .glow{fill:none;stroke:var(--c);stroke-width:9;opacity:0;pointer-events:none}
.node.open .glow{opacity:.2}
.node.done .glow{opacity:.26}
.node.sel .glow{opacity:.5}
.edge.lit,.edge.live{stroke-width:4}
#viewport.drag .halo,#viewport.drag .edge.live{animation-play-state:paused}
.node.sel .body{stroke:#fff;stroke-width:4}
.node .ic{font-size:23px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.locked .ic{opacity:.5;pointer-events:none}
.node .ic{pointer-events:none}
.node .halo{fill:none;stroke:var(--c);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.node.open .halo{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.node .lbl{font-size:12px;fill:var(--text);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0c0a1f;stroke-width:3.5px}
.node.locked .lbl{fill:#7b77ae}
.node .tag{font-size:9px;fill:var(--muted);text-anchor:middle;pointer-events:none;letter-spacing:.06em}
.node .badge{font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .tick{fill:#07102a;stroke:var(--accent);stroke-width:0}
.center .body{stroke-width:4}
.ring{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transition:stroke-dasharray .8s}
.ringbg{fill:none;stroke:var(--stone);stroke-width:6}
/* Figuren */
.ch{pointer-events:none}
.ch .bob{animation:breathe 2.6s ease-in-out infinite}
.ch.walk .bob{animation:bobwalk .3s ease-in-out infinite}
.ch .leg,.ch .arm{transform-box:fill-box;transform-origin:50% 0%}
.ch.walk .legL{animation:swing .5s ease-in-out infinite alternate}
.ch.walk .legR{animation:swing .5s ease-in-out infinite alternate-reverse}
.ch.walk .armL{animation:swing .5s ease-in-out infinite alternate-reverse}
.ch.walk .armR{animation:swing .5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bobwalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.brlabel{font-size:13px;font-weight:700;letter-spacing:.12em;text-anchor:middle;fill:var(--c);opacity:.75;pointer-events:none;text-transform:uppercase}

#btnMore{display:none}
#btnNext .sm{display:none}
#top .br{display:none}
@media(max-width:860px){
  #btnPanel{display:inline-block}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;max-height:62dvh;transform:translateY(105%);transition:transform .3s;z-index:10;border-top:1px solid var(--stone-line);border-left:0;box-shadow:0 -10px 30px #000a;border-radius:16px 16px 0 0;padding-bottom:max(16px,env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  body.panel-open #panel{transform:none}
  #legend{display:none}
  /* kompaktes Kopfband: Zeile 1 = Titel + Fortschritt + ⋯, Zeile 2 = Aktionen, Zeile 3 (optional) = Export */
  #top{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:8px}
  #top h1{font-size:13px;letter-spacing:.02em;order:1}
  #prog{order:2;min-width:0;flex:1 1 0;gap:8px}
  #btnMore{display:inline-block;order:3;min-height:34px;min-width:44px;padding:2px 8px}
  #top .br{display:block;order:4;flex:0 0 100%;height:0;margin:-8px 0 0}
  #btnNext{order:5;flex:1 1 0;min-width:0;padding:9px 11px;min-height:40px;white-space:nowrap}
  #btnPanel{order:6;min-height:40px;min-width:44px}
  #save{order:7;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px}
  #btnInstall{order:8;min-height:40px}
  #offline{display:none!important}
  #top .exp{display:none;order:10}
  #top.more .exp{display:inline-block;min-height:40px}
  /* Bedienelemente groß genug zum Antippen; 16px verhindert das automatische Hineinzoomen auf dem iPhone */
  .field input[type=text],.field input[type=password],.field input[type=date],.field input[type=number],.field select,.field textarea,.addopt input{font-size:16px}
  .opt{padding:11px 12px}
  .btn{min-height:36px}
  #pClose{min-width:44px;min-height:44px;font-size:16px}
  #zoom{bottom:max(12px,env(safe-area-inset-bottom))}
  #zoom .btn{width:44px;height:44px}
  #toast{bottom:max(22px,calc(env(safe-area-inset-bottom) + 10px))}
}
@media(max-width:400px){ #btnNext .lg{display:none} #btnNext .sm{display:inline} }
@media(max-width:860px) and (max-height:520px){
  /* Handy quer: Panel als Seitenleiste, damit die Karte sichtbar bleibt */
  #panel{left:auto;width:min(380px,55vw);top:var(--topH,57px);bottom:0;max-height:none;border-radius:0;border-left:1px solid var(--stone-line);box-shadow:-10px 0 30px #000a;transform:translateX(105%)}
  body.panel-open #panel{transform:none}
  #top h1{display:none}
  #top .br{display:none}
  #top{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:6px}
  #btnNext,#btnPanel,#save,#btnMore{min-height:36px}
  #btnNext{flex:0 0 auto}
}
button,.btn,.opt,.need,.brrow{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>

const NODES = [...RAW, CENTER];
const BY = Object.fromEntries(NODES.map(n=>[n.id,n]));
const BRM = Object.fromEntries(BR.map(b=>[b.id,b]));
const chains = {};
RAW.forEach(n=>{(chains[n.b] ||= []).push(n);});
RAW.forEach(n=>{
  const ch=chains[n.b], i=ch.indexOf(n);
  n.deps = [...(i>0?[ch[i-1].id]:[]), ...n.needs];
  n.chainDep = i>0?ch[i-1].id:null;
});
CENTER.deps = BR.map(b=>chains[b.id][chains[b.id].length-1].id);
CENTER.chainDep = null;
const DEPENDENTS = {};
NODES.forEach(n=>n.deps.forEach(d=>(DEPENDENTS[d] ||= []).push(n.id)));

/* Layout: Ziel in der Mitte, Start außen */
const RIN=150, ROUT=830, MAXSTEP=112, MINSTEP=88;
BR.forEach((b,bi)=>{
  const th = (-90 + bi*360/BR.length)*Math.PI/180;
  b.th = th;
  const ch = chains[b.id], n=ch.length;
  const step = Math.max(MINSTEP, Math.min((ROUT-RIN)/Math.max(1,n-1), MAXSTEP));
  ch.forEach((nd,k)=>{
    const r = RIN + (n-1-k)*step, zig=(k%2?1:-1)*20;
    nd.x = r*Math.cos(th) - zig*Math.sin(th);
    nd.y = r*Math.sin(th) + zig*Math.cos(th);
    nd.r = 30;
  });
  b.lx = (RIN + (n-1)*step + 78)*Math.cos(th); b.ly=(RIN + (n-1)*step + 78)*Math.sin(th);
});
CENTER.x=0; CENTER.y=0; CENTER.r=64;

const ONLINE=window.QUEST_CONFIG||null;   /* gesetzt in der Online-Version → gemeinsamer Modus */

const FILE_JSON='kampagne-fortschritt.json', FILE_MD='kampagne-ergebnisse.md';
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
if(!S || !S.nodes) S={v:1,updatedAt:0,nodes:{}};
const nd = id => (S.nodes[id] ||= {done:false,v:{},notes:''});
const isDone = id => !!(S.nodes[id] && S.nodes[id].done);
const status = n => isDone(n.id)?'done':(n.deps.every(isDone)?'open':'locked');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});

let dirHandle=null, saveState='none', lastSaved=0, fileTimer=null;

function persist(){
  S.updatedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  scheduleFile();
  if(ONLINE) scheduleSync();
}
function scheduleFile(){
  clearTimeout(fileTimer);
  if(!dirHandle){ renderSave(); return; }
  fileTimer=setTimeout(writeFiles,500);
}
let writing=false, writeAgain=false;
async function writeFiles(){
  if(!dirHandle) return;
  if(writing){ writeAgain=true; return; }   /* nie zwei Schreibvorgänge gleichzeitig */
  writing=true;
  try{
    do{
      writeAgain=false;
      const out=[[FILE_JSON,JSON.stringify(S,null,2)],[FILE_MD,toMarkdown()]];
      for(const [name,text] of out){
        const fh=await dirHandle.getFileHandle(name,{create:true});
        const w=await fh.createWritable(); await w.write(text); await w.close();
      }
      saveState='ok'; lastSaved=Date.now();
    }while(writeAgain);
  }catch(e){ console.error(e); saveState='bad'; }
  writing=false;
  renderSave();
}
/* beim Schließen/Verstecken des Tabs noch schnell sichern */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && dirHandle){ clearTimeout(fileTimer); writeFiles(); } });

/* IndexedDB: Ordner-Verbindung merken */
const idb = {
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('lp-quest',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
};
const FS = !!window.showDirectoryPicker;

async function initDir(){
  if(!FS){ saveState='nofs'; renderSave(); return; }
  try{
    const h=await idb.get('dir');
    if(h){
      const p=await h.queryPermission({mode:'readwrite'});
      if(p==='granted'){ dirHandle=h; await syncFromDir(); saveState='ok'; lastSaved=Date.now(); await writeFiles(); }
      else { dirHandle=null; saveState='perm'; window._pendingDir=h; }
    }
  }catch(e){ console.warn(e); }
  renderAll();
}
async function connectDir(){
  if(!FS){ toast('Dein Browser kann keinen Ordner verbinden – nutze ⬇ JSON zum Sichern (Chrome/Edge empfohlen).'); return; }
  try{
    let h=window._pendingDir;
    if(h){ const p=await h.requestPermission({mode:'readwrite'}); if(p!=='granted') h=null; }
    if(!h) h=await window.showDirectoryPicker({mode:'readwrite',id:'lp-quest'});
    dirHandle=h; window._pendingDir=null;
    try{ await idb.set('dir',h); }catch(e){ console.warn('Ordner konnte nicht gemerkt werden',e); }

}
async function syncFromDir(){
  try{

    const d=JSON.parse(txt);
    if(d && d.nodes && (d.updatedAt||0) > (S.updatedAt||0)){
      S=d; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

  L.push('');

  if(S.pos&&BY[S.pos]) L.push('', `Zuletzt bearbeitet / Standort der Figuren: **${S.pos}** ${BY[S.pos].t}`);
  L.push('');
  const groups=[...BR.map(b=>({name:`${b.id} · ${b.name}`,nodes:chains[b.id]})),{name:'Ziel',nodes:[CENTER]}];
  groups.forEach(g=>{
    L.push(`## ${g.name}`);
    g.nodes.forEach(n=>{
      const st=status(n), d=S.nodes[n.id]||{v:{},notes:''};
      const mark = st==='done'?'[x]':'[ ]';
      let line=`- ${mark} **${n.id}** ${n.t}`;
      if(st==='done'&&d.doneAt) line+=` (erledigt ${fmtDate(d.doneAt)})`;
      if(st==='locked') line+=' – gesperrt, wartet auf: '+n.deps.filter(x=>!isDone(x)).join(', ');
      L.push(line);
      n.f.forEach(f=>{
        const v=(d.v||{})[f.k];
        if(v===undefined||v===''||v===false||(Array.isArray(v)&&!v.length)) return;
        const val = f.type==='check'?'ja':(Array.isArray(v)?v.join(', '):String(v));

      if(d.notes) L.push(`  - Notiz: ${d.notes.replace(/\n/g,'\n    ')}`);
    });

  });
  return L.join('\n');
}

const svg=document.getElementById('map'), view=document.getElementById('viewport'), world=document.getElementById('world');
const gEdges=document.getElementById('gEdges'), gNodes=document.getElementById('gNodes'), gLabels=document.getElementById('gLabels'), gFx=document.getElementById('gFx');
const NS='http://www.w3.org/2000/svg';
let cam={x:0,y:0,s:.5}, sel=null;

const MINS=.1, MAXS=2.5, clampS=s=>Math.min(MAXS,Math.max(MINS,s));
/* Bildmitte der Karte (bei offenem Handy-Panel nach oben verschoben) */
function viewOrigin(){
  const W=view.clientWidth,H=view.clientHeight;
  const open = window.innerWidth<=860 && document.body.classList.contains('panel-open');
  const side = open && window.matchMedia('(max-height:520px)').matches;   /* Handy quer: Panel steht rechts daneben */
  const sheet = open && !side;
  if(side) return {W,H,ox:Math.max(80,(W-panel.offsetWidth)/2),oy:H/2};
  if(sheet){   /* Karte in den sichtbaren Bereich über dem Panel zentrieren (etwas höher, da das Label unter dem Knoten steht) */
    const ph=Math.min(panel.scrollHeight,window.innerHeight*0.62), vis=window.innerHeight-ph-view.getBoundingClientRect().top;
    return {W,H,ox:W/2,oy:Math.max(36,vis/2-14)};
  }
  return {W,H,ox:W/2,oy:H/2};
}
/* Die Karte ist ein 2000×2000-SVG; die Kamera ist eine CSS-Transformation auf einer eigenen
   Grafikebene → Verschieben/Zoomen skaliert nur die fertige Textur (GPU) statt neu zu zeichnen.
   Nach der Bewegung wird will-change wieder gelöst, damit die Karte scharf neu gerastert wird. */
const ORG=1000; let wcTimer=0;
function applyCam(){
  const v=viewOrigin();
  svg.style.willChange='transform';
  svg.style.transform=`translate3d(${v.ox-(ORG+cam.x)*cam.s}px,${v.oy-(ORG+cam.y)*cam.s}px,0) scale(${cam.s})`;
  clearTimeout(wcTimer); wcTimer=setTimeout(()=>{ svg.style.willChange='auto'; },220);
}
let camRaf=0;   /* mehrere Eingabeereignisse pro Frame → nur ein Zeichnen */
function scheduleCam(){ if(!camRaf) camRaf=requestAnimationFrame(()=>{camRaf=0;applyCam();}); }
function zoomAt(clientX,clientY,ns){
  const r=view.getBoundingClientRect(), v=viewOrigin();
  const mx=clientX-r.left, my=clientY-r.top;
  const wx=cam.x+(mx-v.ox)/cam.s, wy=cam.y+(my-v.oy)/cam.s;
  ns=clampS(ns); cam.s=ns; cam.x=wx-(mx-v.ox)/ns; cam.y=wy-(my-v.oy)/ns; scheduleCam();
}
let anim=null;
function flyTo(x,y,s){
  const from={...cam}, to={x,y,s:s??cam.s}, t0=performance.now(), D=650;
  cancelAnimationFrame(anim);
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function step(now){
    const t=Math.min(1,(now-t0)/D), e=ease(t);
    cam={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,s:from.s+(to.s-from.s)*e};
    applyCam(); if(t<1) anim=requestAnimationFrame(step);
  })(t0);
}
function fit(){
  const W=view.clientWidth,H=view.clientHeight;
  if(!W||!H){ setTimeout(fit,100); return; }
  flyTo(0,0,clampS(Math.min(W,H)/(2*ROUT+260)));
}
function el(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e); return e;
}
function wrap(text,max=17){
  const words=text.split(' '),lines=[];let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){lines.push(cur);cur=w;} else cur=(cur+' '+w).trim(); });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
/* Emojis einmalig als Bild vorrendern: Farb-Emoji-Text im SVG war der größte Ruckler-Verursacher */

function emojiImg(ch,gray){

}

/* Pan / Zoom / Klick */
const ptrs=new Map(); let drag=null, pinch=null;
view.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    drag=null; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:cam.s};
    cancelAnimationFrame(anim); view.classList.add('drag');
  } else if(ptrs.size===1){
    drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  }
});
view.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && ptrs.size>=2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*d/pinch.d);
    return;
  }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)>6){drag.moved=true; view.classList.add('drag'); cancelAnimationFrame(anim);}
  if(drag.moved){ cam.x=drag.cx-dx/cam.s; cam.y=drag.cy-dy/cam.s; scheduleCam(); }
});
function endPointer(e,cancelled){
  if(!ptrs.delete(e.pointerId)) return;
  if(pinch){ if(ptrs.size<2){ pinch=null; view.classList.remove('drag'); } drag=null; return; }
  const was=drag; drag=null; view.classList.remove('drag');
  if(was && !was.moved && !cancelled){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    let g=t && t.closest && t.closest('.node');
    if(!g && e.pointerType!=='mouse'){   /* Finger sind ungenau: nächsten Knoten im Umkreis von ~26px nehmen */
      const r=view.getBoundingClientRect(), v=viewOrigin();
      const wx=cam.x+(e.clientX-r.left-v.ox)/cam.s, wy=cam.y+(e.clientY-r.top-v.oy)/cam.s;
      let best=null, bd=Infinity;
      NODES.forEach(n=>{ const d=Math.hypot(n.x-wx,n.y-wy)-(n.r||0); if(d<bd){bd=d;best=n;} });
      if(best && bd*cam.s<=26) g={dataset:{id:best.id}};
    }
    if(g) selectNode(g.dataset.id);
    else { sel=null; markSel(); if(window.innerWidth<=860) document.body.classList.remove('panel-open'); applyCam(); renderPanel(); }
  }
}
view.addEventListener('pointerup',e=>endPointer(e,false));
view.addEventListener('pointercancel',e=>endPointer(e,true));
view.addEventListener('wheel',e=>{
  e.preventDefault(); cancelAnimationFrame(anim);
  const dy = e.deltaY*(e.deltaMode===1?16:1);
  zoomAt(e.clientX,e.clientY,cam.s*Math.exp(-dy*(e.ctrlKey?0.01:0.0015)));
},{passive:false});

/* Aktionen */
function complete(id){
  const n=BY[id]; if(!reqOk(n)||status(n)!=='open') return;
  const before=new Set(openNodes().map(x=>x.id));
  const d=nd(id); d.done=true; d.doneAt=Date.now();
  persist();
  const fresh=openNodes().filter(x=>!before.has(x.id));
  burst(n);
  renderAll();
  if(id==='Z'){ document.getElementById('win').classList.add('show'); return; }
  if(fresh.length){
    toast('✨ Freigeschaltet: '+fresh.map(x=>x.id+' '+x.t).join(' · '));
    /* nur nachziehen, wenn der Nutzer in der Zwischenzeit nicht woanders hingeklickt hat */
    setTimeout(()=>{ if(sel===id || sel===null) selectNode(fresh[0].id); },900);
  } else toast('✓ Geschafft – aber der nächste Schritt wartet noch auf andere Zweige.');
}
function reopen(id){
  const blockers=(DEPENDENTS[id]||[]).filter(isDone);
  if(blockers.length){ toast('Erst diese wieder öffnen: '+blockers.join(', ')); return; }
  const d=nd(id); d.done=false; delete d.doneAt; persist(); renderAll();
}
function burst(n){
  for(let i=0;i<16;i++){
    const c=el('circle',{cx:n.x,cy:n.y,r:4,fill:n.b?BRM[n.b].c:'#5ef0ff'},gFx);
    c.style.transformBox='fill-box'; c.style.transformOrigin='center';   /* sonst schrumpfen die Funken zum Kartenmittelpunkt */
    const a=Math.PI*2*i/16, dist=60+Math.random()*50;
    c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) scale(.2)`,opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>c.remove();
  }
}
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3800);
}

const chars=[];
function mkChar(k){
  const g=el('g',{class:'ch'},gChars), fxw=el('g',{},g), flip=el('g',{},fxw);
  flip.innerHTML=SPRITE[k];
  return {k,g,fxw,flip,x:0,y:0,dir:1};
}
const nodePos=(id,c)=>{ const n=BY[id]; return {x:n.x+(c.k==='s'?-(n.r+18):(n.r+22)), y:n.y+n.r*.45}; };
function setC(c,x,y){ c.x=x; c.y=y; c.g.setAttribute('transform',`translate(${x},${y})`); }
function faceC(c,dx){ if(Math.abs(dx)<.5) return; c.dir=dx<0?-1:1; c.flip.setAttribute('transform',`scale(${c.dir},1)`); }
function idleFace(c){ faceC(c,c.k==='s'?1:-1); }
function cancelFx(c){ c.fxw.getAnimations().forEach(a=>a.cancel()); c.g.classList.remove('walk'); }
function placeChars(id){ chars.forEach(c=>{ const p=nodePos(id,c); setC(c,p.x,p.y); idleFace(c); }); }
function resetChars(){
  moveTok++; const id=(S.pos&&BY[S.pos])?S.pos:(openNodes()[0]||BY.A1).id; S.pos=id;
  chars.forEach(cancelFx); placeChars(id);
}
/* Weg nur innerhalb eines Zweigs (inkl. Ziel in der Mitte) – sonst null = teleportieren */
function pathBetween(a,b){
  if(a===b) return [a];
  const A=BY[a], B=BY[b];
  const br = A.b && A.b===B.b ? A.b : (!A.b ? B.b : (!B.b ? A.b : null));
  if(!br) return null;
  const seq=[...chains[br].map(n=>n.id),'Z'], i=seq.indexOf(a), j=seq.indexOf(b);
  if(i<0||j<0) return null;
  return i<j ? seq.slice(i,j+1) : seq.slice(j,i+1).reverse();
}
let moveTok=0;
function moveChars(id,silent){
  if(!chars.length) return;
  const from=S.pos&&BY[S.pos]?S.pos:id;
  if(from===id && S.pos===id) return;
  moveTok++; const tok=moveTok;
  /* Mitten im Teleport (unsichtbar) → sofort am alten Ziel absetzen; mitten im Laufen → von der aktuellen Stelle weiterlaufen */
  chars.forEach(c=>{ const midTp=c.fxw.getAnimations().length>0; cancelFx(c); if(midTp){ const p=nodePos(from,c); setC(c,p.x,p.y); idleFace(c); } });
  S.pos=id; if(!silent) persist();
  const path=pathBetween(from,id);
  if(path) walk(path,tok); else teleport(id,tok);
}
function walk(path,tok){
  chars.forEach((c,ci)=>{
    const pts=[{x:c.x,y:c.y},...path.map(id=>nodePos(id,c))], segs=[]; let total=0;
    for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); segs.push(d); total+=d; }
    const speed=Math.max(240,total/2.2), t0=performance.now()+ci*320;   /* lange Wege dauern höchstens ~2 s */
    (function step(now){
      if(tok!==moveTok) return;
      let dist=(now-t0)/1000*speed;
      if(dist<=0){ requestAnimationFrame(step); return; }
      if(dist>=total){ const e=pts[pts.length-1]; setC(c,e.x,e.y); c.g.classList.remove('walk'); idleFace(c); return; }
      c.g.classList.add('walk');
      let i=0; while(i<segs.length-1 && dist>segs[i]){ dist-=segs[i]; i++; }
      const a=pts[i], b=pts[i+1], t=dist/(segs[i]||1);
      setC(c,a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t); faceC(c,b.x-a.x);
      requestAnimationFrame(step);
    })(performance.now());
  });
}
function beam(x,y){
  const r=el('rect',{x:x-14,y:y-125,width:28,height:127,rx:8,fill:'url(#beam)'},gFx);
  r.style.transformBox='fill-box'; r.style.transformOrigin='50% 100%';
  r.animate([{opacity:0,transform:'scaleX(.2)'},{opacity:1,transform:'scaleX(1)',offset:.35},{opacity:0,transform:'scaleX(.35)'}],{duration:650}).onfinish=()=>r.remove();
  const e=el('ellipse',{cx:x,cy:y,rx:12,ry:4.5,fill:'none',stroke:'#5ef0ff','stroke-width':2.5},gFx);
  e.style.transformBox='fill-box'; e.style.transformOrigin='center';
  e.animate([{opacity:.95,transform:'scale(.4)'},{opacity:0,transform:'scale(3)'}],{duration:700}).onfinish=()=>e.remove();
}
function teleport(id,tok){
  chars.forEach((c,ci)=>setTimeout(()=>{
    if(tok!==moveTok) return;
    beam(c.x,c.y);
    c.fxw.animate([{transform:'scale(1,1)',opacity:1,filter:'brightness(1)'},{transform:'scale(.12,1.9)',opacity:0,filter:'brightness(3.5)'}],{duration:330,easing:'ease-in',fill:'forwards'}).onfinish=()=>{
      if(tok!==moveTok) return;
      const p=nodePos(id,c); setC(c,p.x,p.y); idleFace(c); beam(p.x,p.y);
      c.fxw.animate([{transform:'scale(.12,1.9)',opacity:0,filter:'brightness(3.5)'},{transform:'scale(1,1)',opacity:1,filter:'brightness(1)'}],{duration:400,easing:'ease-out',fill:'forwards'}).onfinish=()=>{ if(tok===moveTok) c.fxw.getAnimations().forEach(a=>a.cancel()); };
    };
  }, ci*170));
}

/* ============================================================
   GEMEINSAMER MODUS – nur aktiv, wenn window.QUEST_CONFIG gesetzt ist.
   Zugriff nur über Datenbankfunktionen, die den Zugangscode prüfen (Tabellen sind gesperrt).
   Abgleich feldweise: zwei Personen können gleichzeitig verschiedene Felder desselben Schritts bearbeiten.
   ============================================================ */
const AUTH_KEY='lpq-online-auth', BASE_KEY='landingpage-quest-online-base-v1';
const SYNC={code:null,name:null,since:null,busy:false,again:false,timer:null,loop:null,online:null,first:true,base:{nodes:{},pos:undefined},at:{},by:{}};
const jclone=x=>JSON.parse(JSON.stringify(x));
const sameVal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const newBase=()=>({done:false,v:{},notes:''});
function bylineText(id){
  if(!ONLINE||!SYNC.by[id]) return '';
  return `Zuletzt geändert von <b>${esc(SYNC.by[id])}</b> · ${fmtDate(SYNC.at[id])}`;
}
async function api(fn,body){
  const r=await fetch(ONLINE.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:ONLINE.key,Authorization:'Bearer '+ONLINE.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const authErr=r=>Object.assign(new Error(r.error==='locked'?'Zu viele Fehlversuche – bitte 10 Minuten warten.':'Zugangscode falsch oder geändert.'),{auth:true});
function loadBase(){ try{ const b=JSON.parse(localStorage.getItem(BASE_KEY)); if(b&&b.nodes){ SYNC.base=b; SYNC.first=false; } }catch(e){} }
function saveBase(){ try{ localStorage.setItem(BASE_KEY,JSON.stringify(SYNC.base)); }catch(e){} }
function patchFor(id){
  const cur=S.nodes[id]; if(!cur) return null;
  const b=SYNC.base.nodes[id]||newBase(), p={}; let any=false, pv={};
  for(const k in (cur.v||{})) if(!sameVal(cur.v[k],(b.v||{})[k])){ pv[k]=cur.v[k]; any=true; }
  if(any) p.v=pv;
  if((cur.notes||'')!==(b.notes||'')){ p.notes=cur.notes||''; any=true; }
  if(!!cur.done!==!!b.done){ p.done=!!cur.done; p.doneAt=cur.doneAt||null; any=true; }
  return any?p:null;
}
function applyPatchToBase(id,p){
  const b=(SYNC.base.nodes[id] ||= newBase());
  if(p.v) Object.assign(b.v,jclone(p.v));
  if('notes' in p) b.notes=p.notes;
  if('done' in p){ b.done=p.done; b.doneAt=p.doneAt; }
}
async function pushDiffs(){
  for(const n of NODES){
    const p=patchFor(n.id); if(!p) continue;
    const r=await api('quest_put_node',{p_code:SYNC.code,p_node:n.id,p_patch:p,p_who:SYNC.name});
    if(!r.ok){ if(r.error==='unauthorized'||r.error==='locked') throw authErr(r); throw new Error(r.error); }
    applyPatchToBase(n.id,p); SYNC.at[n.id]=r.at; SYNC.by[n.id]=SYNC.name;
  }
  if(S.pos && S.pos!==SYNC.base.pos){
    const r=await api('quest_put_meta',{p_code:SYNC.code,p_key:'pos',p_value:S.pos,p_who:SYNC.name});
    if(!r.ok){ if(r.error==='unauthorized'||r.error==='locked') throw authErr(r); throw new Error(r.error); }
    SYNC.base.pos=S.pos;
  }
}
async function pull(){
  const r=await api('quest_get',{p_code:SYNC.code,p_since:SYNC.since});
  if(!r.ok) throw authErr(r);
  const firstLoad=SYNC.since===null;
  if(SYNC.first && r.nodes.length>0){ S.nodes={}; SYNC.base={nodes:{},pos:undefined}; }   /* erster Abgleich: der gemeinsame Stand gewinnt */
  let mapChanged=false, nodeChanged=false, anyChange=false;
  r.nodes.forEach(({id,data,at,by})=>{
    const n=BY[id]; if(!n||!data) return;
    SYNC.at[id]=at; SYNC.by[id]=by;
    const cur=nd(id), b=(SYNC.base.nodes[id] ||= newBase());
    for(const k in (data.v||{})){
      const rv=data.v[k], pending=!sameVal(cur.v[k],b.v[k]);
      b.v[k]=rv;
      if(!pending && !sameVal(cur.v[k],rv)){ cur.v[k]=rv; anyChange=true; if(id===sel) nodeChanged=true; }
    }
    if('notes' in data){
      const pending=(cur.notes||'')!==(b.notes||''); b.notes=data.notes||'';
      if(!pending && (cur.notes||'')!==b.notes){ cur.notes=b.notes; anyChange=true; if(id===sel) nodeChanged=true; }
    }
    if('done' in data){
      const pending=!!cur.done!==!!b.done; b.done=!!data.done; b.doneAt=data.doneAt||undefined;
      if(!pending && !!cur.done!==b.done){ cur.done=b.done; if(b.done) cur.doneAt=data.doneAt||Date.now(); else delete cur.doneAt; mapChanged=true; anyChange=true; }
      else if(!pending && b.done && data.doneAt) cur.doneAt=data.doneAt;
    }
  });
  let posMove=null;
  r.meta.forEach(m=>{
    if(m.key==='pos' && m.value && BY[m.value]){
      const old=SYNC.base.pos; SYNC.base.pos=m.value;
      if(firstLoad){ S.pos=m.value; posMove='reset'; }
      else if(S.pos===old && S.pos!==m.value) posMove=m.value;
    }
  });
  SYNC.since=r.server_time; SYNC.first=false;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  /* Anzeige aktualisieren */
  if(firstLoad){ renderAll(); if(posMove==='reset') resetChars(); }
  else {
    if(mapChanged){ renderTop(); renderMap(); }
    if(sel){ if(nodeChanged||mapChanged) refreshPanelFields(); }
    else if(anyChange) renderOverview();
    if(posMove && posMove!=='reset') moveChars(posMove,true);
  }
}
/* Panel aktualisieren, ohne die Eingabe zu stören, die du gerade tippst */
function refreshPanelFields(){
  if(!sel) return;
  const n=BY[sel], st=status(n);
  if(panel.dataset.st!==st){ renderPanel(); return; }
  if(st==='locked') return;
  const d=nd(sel), act=document.activeElement;
  panel.querySelectorAll('[data-k]').forEach(inp=>{
    if(inp===act) return;
    const v=d.v[inp.dataset.k];
    if(inp.type==='checkbox') inp.checked=v===true; else if(inp.value!==String(v??'')) inp.value=v??'';
  });
  panel.querySelectorAll('[data-multi]').forEach(w=>{
    if(w.contains(act)) return;
    const f=n.f.find(x=>x.k===w.dataset.multi); if(!f) return;
    const cur=Array.isArray(d.v[f.k])?d.v[f.k]:(d.v[f.k]?[d.v[f.k]]:[]);
    w.innerHTML=[...f.opts,...cur.filter(x=>!f.opts.includes(x))].map(o=>optHTML(o,cur.includes(o))).join('');
  });
  const nt=panel.querySelector('[data-notes]'); if(nt && nt!==act && nt.value!==(d.notes||'')) nt.value=d.notes||'';
  const by=document.getElementById('byline'); if(by) by.innerHTML=bylineText(sel);
  updateReq(n); updateCalc(n);
}
function setOnlineState(ok){
  if(SYNC.online===ok) return;
  SYNC.online=ok; saveState=ok?'on':'off'; renderSave();
}
async function tick(){
  if(!SYNC.code) return;
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true;
  try{
    /* allererster Abgleich: erst den gemeinsamen Stand lesen, dann eigene Änderungen senden –
       sonst überschreibt die lokale Standardposition/ein veralteter Cache den Serverstand */
    if(SYNC.since===null){ await pull(); await pushDiffs(); }
    else { await pushDiffs(); await pull(); }
    saveBase(); setOnlineState(true);
  }
  catch(e){ if(e&&e.auth) logoutOnline(e.message); else { console.warn('Sync:',e); setOnlineState(false); } }
  SYNC.busy=false;
  if(SYNC.again){ SYNC.again=false; scheduleSync(); }
}
function scheduleSync(){ clearTimeout(SYNC.timer); SYNC.timer=setTimeout(tick,350); }
function showGate(msg){
  document.getElementById('gate').classList.add('show');
  document.getElementById('gErr').textContent=msg||'';
  const a=(()=>{try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){return null;}})();
  if(a&&a.name) document.getElementById('gName').value=a.name;
  setTimeout(()=>document.getElementById(document.getElementById('gName').value?'gCode':'gName').focus(),50);
}
function logoutOnline(msg){
  clearInterval(SYNC.loop); clearTimeout(SYNC.timer); SYNC.loop=null; SYNC.code=null; SYNC.since=null; SYNC.online=null;
  try{ const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); localStorage.setItem(AUTH_KEY,JSON.stringify({name:a&&a.name||SYNC.name||''})); }catch(e){}
  showGate(msg);
}
function startLoop(){
  SYNC.since=null; tick();
  clearInterval(SYNC.loop); SYNC.loop=setInterval(tick,2500);
}
async function startOnline(){
  loadBase();
  let a=null; try{ a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){}
  if(a&&a.code&&a.name){ SYNC.code=a.code; SYNC.name=a.name; saveState='off'; renderSave(); startLoop(); }
  else showGate('');
  document.getElementById('gateForm').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const name=document.getElementById('gName').value.trim(), code=document.getElementById('gCode').value.trim().toUpperCase(), btn=document.getElementById('gBtn'), err=document.getElementById('gErr');
    if(!name||!code){ err.textContent='Bitte Name und Zugangscode eingeben.'; return; }
    btn.disabled=true; err.textContent='';
    try{
      const r=await api('quest_login',{p_code:code});
      if(!r.ok) throw authErr(r);
      SYNC.code=code; SYNC.name=name;
      try{ localStorage.setItem(AUTH_KEY,JSON.stringify({code,name})); }catch(e){}
      document.getElementById('gate').classList.remove('show'); document.getElementById('gCode').value='';
      SYNC.first=!localStorage.getItem(BASE_KEY);
      saveState='off'; SYNC.online=null; renderSave(); startLoop();
    }catch(e){ err.textContent=e.auth?e.message:'Keine Verbindung zum Server. Bitte später erneut versuchen.'; }
    btn.disabled=false;
  });
}

/* Start */
applyCam(); renderAll();
chars.push(mkChar('t'),mkChar('s')); resetChars();
cam={x:0,y:0,s:.4}; applyCam(); fit();
if(ONLINE) startOnline(); else initDir();
</script>
<script>
/* ===== Web-App (PWA): Service Worker, Installieren, Offline-Anzeige ===== */
(function(){
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  let deferred=null; const btn=document.getElementById('btnInstall');
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; btn.style.display='inline-block'; });
  btn.addEventListener('click',async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred=null; btn.style.display='none'; });
  window.addEventListener('appinstalled',()=>{ btn.style.display='none'; });
  const upd=()=>document.body.classList.toggle('is-offline',!navigator.onLine);
  window.addEventListener('online',upd); window.addEventListener('offline',upd); upd();
})();
</script>
